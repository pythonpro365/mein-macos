name: macos-with-vnc
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup VNC
      env:
        VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      run: |
        set -Eeuo pipefail

        echo "===== 1. Enable macOS Screen Sharing (VNC) ====="
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on \
          -restart -agent -privs -all \
          -clientopts -setvnclegacy -vnclegacy yes \
          -clientopts -setvncpw -vncpw "$VNC_PASSWORD"

        echo "VNC aktiviert."

    - name: Setup Tailscale (manual, macOS)
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        set -Eeuo pipefail

        echo "===== 1. Install Tailscale via Homebrew ====="
        brew install --cask tailscale || brew install tailscale

        echo "===== 2. Locate tailscaled binary ====="
        # Homebrew legt die Binaries je nach Version an verschiedenen Stellen ab
        TAILSCALED="$(find /Applications/Tailscale.app /opt/homebrew /usr/local -name tailscaled -type f 2>/dev/null | head -n1 || true)"
        TAILSCALE_CLI="$(find /Applications/Tailscale.app /opt/homebrew /usr/local -name tailscale -type f 2>/dev/null | head -n1 || true)"

        echo "tailscaled : $TAILSCALED"
        echo "tailscale  : $TAILSCALE_CLI"

        if [[ -z "$TAILSCALE_CLI" ]]; then
          echo "::error::Tailscale CLI nicht gefunden."
          exit 1
        fi

        echo "===== 3. Start tailscaled in userspace mode (no sudo needed) ====="
        sudo mkdir -p /var/lib/tailscale /var/run/tailscale
        sudo "$TAILSCALED" \
          --tun=userspace-networking \
          --state=/var/lib/tailscale/tailscaled.state \
          --socket=/var/run/tailscale/tailscaled.sock \
          > /tmp/tailscaled.log 2>&1 &
        disown

        sleep 5

        echo "===== 4. tailscale up ====="
        sudo "$TAILSCALE_CLI" --socket=/var/run/tailscale/tailscaled.sock up \
          --authkey="$TAILSCALE_AUTH_KEY" \
          --hostname="gha-macos-vnc" \
          --accept-routes

        echo "===== 5. Tailscale status ====="
        sudo "$TAILSCALE_CLI" --socket=/var/run/tailscale/tailscaled.sock status || true

    - name: Show Tailscale IP
      run: |
        set -Eeuo pipefail

        TAILSCALE_CLI="$(find /Applications/Tailscale.app /opt/homebrew /usr/local -name tailscale -type f 2>/dev/null | head -n1 || true)"

        echo "=========================================="
        echo "         VNC CONNECTION INFO"
        echo "=========================================="
        TS_IP="$(sudo "$TAILSCALE_CLI" --socket=/var/run/tailscale/tailscaled.sock ip -4 | head -n1 || true)"
        echo "Address  : $TS_IP  (Port 5900 – Standard)"
        echo "User     : vncuser"
        echo "Password : (aus deinem VNC_PASSWORD Secret)"
        echo ""
        echo "RealVNC-Adresse: $TS_IP:5900"
        echo "=========================================="

    - name: Keep session alive (tmate)
      uses: mxschmitt/action-tmate@v3
