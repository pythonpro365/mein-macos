name: macos-with-vnc
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prevent display sleep and ensure GUI session
      run: |
        set -Eeuo pipefail

        echo "===== 1. Show current console user ====="
        stat -f "%Su" /dev/console || true

        echo "===== 2. Disable screensaver ====="
        defaults -currentHost write com.apple.screensaver idleTime 0 || true
        defaults write com.apple.screensaver idleTime 0 || true

        echo "===== 3. Disable display sleep and system sleep ====="
        sudo pmset -a displaysleep 0
        sudo pmset -a sleep 0
        sudo pmset -a disksleep 0
        sudo pmset -a womp 1 || true

        echo "===== 4. Start caffeinate in background ====="
        nohup caffeinate -disu > /tmp/caffeinate.log 2>&1 &
        disown
        sleep 2
        ps aux | grep caffeinate | grep -v grep || true

        echo "===== 5. Wake display (simulate key press) ====="
        osascript -e 'tell application "System Events" to key code 49' || true
        sleep 1

        echo "Display sollte jetzt wach sein."

    - name: Set runner password and enable auto-login
      env:
        RUNNER_PASSWORD: ${{ secrets.RUNNER_PASSWORD }}
      run: |
        set -Eeuo pipefail

        echo "===== 1. Create /etc/kcpassword for auto-login ====="
        python3 -c "import sys; pw=sys.argv[1].encode(); k=bytes([0x7D,0x89,0x52,0x23,0xD2,0xBC,0xDD,0xEA,0xA3,0xB9,0x1F,0xFA]); pw+=b'\x00'*((12-len(pw)%12)%12); sys.stdout.buffer.write(bytes(a^b for a,b in zip(pw,(k*(len(pw)//12+1))[:len(pw)])))" "$RUNNER_PASSWORD" | sudo tee /etc/kcpassword > /dev/null

        sudo chmod 600 /etc/kcpassword
        sudo chown root:wheel /etc/kcpassword
        echo "kcpassword erstellt:"
        ls -la /etc/kcpassword

        echo "===== 2. Set autoLoginUser ====="
        sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser -string "runner"
        sudo defaults read /Library/Preferences/com.apple.loginwindow autoLoginUser

        echo "===== 3. Disable lock screen password prompt ====="
        sudo defaults write /Library/Preferences/com.apple.loginwindow DisableScreenLockImmediate -bool true || true
        defaults write com.apple.screensaver askForPassword -int 0 || true
        defaults write com.apple.screensaver askForPasswordDelay -int 0 || true

        echo "===== 4. Restart LoginWindow so auto-login kicks in ====="
        sudo launchctl kickstart -k system/com.apple.loginwindow || true
        sleep 15

        echo "===== 5. Verify console user ====="
        stat -f "%Su" /dev/console || true

    - name: Setup VNC (Apple Screen Sharing + Legacy password)
      env:
        VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      run: |
        set -Eeuo pipefail

        echo "===== 0. Grant Screen Recording + Screen Control + Input via TCC ====="
        TCCDB="/Library/Application Support/com.apple.TCC/TCC.db"

        sudo sqlite3 "$TCCDB" "SELECT service FROM access LIMIT 1;" || echo "TCC.db nicht zugänglich"

        for SERVICE in kTCCServiceScreenCapture kTCCServiceRemoteDesktop kTCCServicePostEvent kTCCServiceListenEvent kTCCServiceAccessibility; do
          for CLIENT in com.apple.screensharing.agent com.apple.RemoteDesktop.agent /System/Library/CoreServices/RemoteManagement/ARDAgent.app; do
            sudo sqlite3 "$TCCDB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('$SERVICE', '$CLIENT', 0, 2, 2, 1);" 2>/dev/null || true
          done
        done

        echo "TCC permissions gesetzt."

        echo "===== 1. Enable macOS Screen Sharing with legacy VNC password ====="
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on \
          -restart -agent -privs -all \
          -allowAccessFor -allUsers \
          -clientopts -setvnclegacy -vnclegacy yes \
          -clientopts -setvncpw -vncpw "$VNC_PASSWORD"

        echo "===== 2. Restart ARD agent to pick up TCC changes ====="
        sudo killall ARDAgent 2>/dev/null || true
        sleep 2
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent

        echo "===== 3. Verify VNC is listening on 5900 ====="
        sleep 3
        sudo lsof -iTCP:5900 -sTCP:LISTEN || true

        echo "VNC aktiviert (Legacy-Passwort)."

    - name: Setup Tailscale (CLI, macOS)
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        set -Eeuo pipefail

        brew uninstall --cask tailscale-app 2>/dev/null || true
        brew uninstall --cask tailscale 2>/dev/null || true

        brew install tailscale

        TAILSCALED="$(command -v tailscaled || true)"
        TAILSCALE_CLI="$(command -v tailscale || true)"

        if [[ -z "$TAILSCALED" ]]; then
          TAILSCALED="$(find /opt/homebrew /usr/local -name tailscaled -type f 2>/dev/null | head -n1 || true)"
        fi
        if [[ -z "$TAILSCALE_CLI" ]]; then
          TAILSCALE_CLI="$(find /opt/homebrew /usr/local -name tailscale -type f 2>/dev/null | head -n1 || true)"
        fi

        echo "tailscaled : $TAILSCALED"
        echo "tailscale  : $TAILSCALE_CLI"

        if [[ -z "$TAILSCALED" || -z "$TAILSCALE_CLI" ]]; then
          echo "::error::Tailscale binaries nicht gefunden."
          exit 1
        fi

        sudo mkdir -p /var/lib/tailscale /var/run/tailscale
        sudo "$TAILSCALED" \
          --tun=userspace-networking \
          --state=/var/lib/tailscale/tailscaled.state \
          --socket=/var/run/tailscale/tailscaled.sock \
          > /tmp/tailscaled.log 2>&1 &
        disown

        sleep 8

        if ! sudo test -S /var/run/tailscale/tailscaled.sock; then
          echo "::error::tailscaled socket nicht vorhanden."
          cat /tmp/tailscaled.log || true
          exit 1
        fi

        sudo "$TAILSCALE_CLI" \
          --socket=/var/run/tailscale/tailscaled.sock \
          up \
          --authkey="$TAILSCALE_AUTH_KEY" \
          --hostname="gha-macos-vnc" \
          --timeout=45s \
          --reset || {
            echo "::error::tailscale up fehlgeschlagen oder Timeout."
            cat /tmp/tailscaled.log || true
            exit 1
          }

        sudo "$TAILSCALE_CLI" --socket=/var/run/tailscale/tailscaled.sock status

    - name: Show Tailscale IP
      run: |
        set -Eeuo pipefail

        TAILSCALE_CLI="$(command -v tailscale || find /opt/homebrew /usr/local -name tailscale -type f 2>/dev/null | head -n1 || true)"

        echo "=========================================="
        echo "         VNC CONNECTION INFO"
        echo "=========================================="
        TS_IP="$(sudo "$TAILSCALE_CLI" --socket=/var/run/tailscale/tailscaled.sock ip -4 | head -n1 || true)"
        echo "Address  : $TS_IP"
        echo "Port     : 5900"
        echo "Password : (value of your VNC_PASSWORD secret)"
        echo ""
        echo "TigerVNC command:"
        echo "  .\\vncviewer.exe -SecurityTypes=VncAuth $TS_IP:5900"
        echo "=========================================="

    - name: Keep session alive (tmate)
      uses: mxschmitt/action-tmate@v3
