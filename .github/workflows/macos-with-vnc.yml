name: macos-with-vnc
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup VNC + ngrok
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        VNC_USER_PASSWORD: ${{ secrets.VNC_USER_PASSWORD }}
        VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      run: |
        set -e

        echo "===== 1. Enable macOS Screen Sharing (VNC) ====="
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on \
          -restart -agent -privs -all \
          -clientopts -setvnclegacy -vnclegacy yes \
          -clientopts -setvncpw -vncpw "$VNC_PASSWORD"

        echo "===== 2. Install ngrok ====="
        brew install ngrok/ngrok/ngrok || true

        echo "===== 3. Configure ngrok (fresh) ====="
        rm -f "$HOME/.config/ngrok/ngrok.yml"
        ngrok config add-authtoken "$NGROK_AUTH_TOKEN"

        echo "===== 4. Start ngrok in background ====="
        nohup ngrok tcp 5900 > /tmp/ngrok.log 2>&1 &
        disown

        echo "===== 5. Wait for ngrok API ====="
        for i in $(seq 1 30); do
          if curl -s http://127.0.0.1:4040/api/tunnels >/dev/null 2>&1; then
            echo "ngrok up after $i attempts"
            break
          fi
          echo "Waiting for ngrok ($i/30)..."
          sleep 2
        done

        echo "===== ngrok log ====="
        cat /tmp/ngrok.log || true

    - name: Show VNC connection address
      run: |
        echo "=========================================="
        echo "         VNC CONNECTION INFO"
        echo "=========================================="
        ADDR=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url' | sed 's|tcp://||')
        echo "Address  : $ADDR"
        echo "User     : vncuser (or just use the VNC password)"
        echo "Password : (value of your VNC_PASSWORD secret)"
        echo "=========================================="

    - name: Keep session alive (tmate)
      uses: mxschmitt/action-tmate@v3
