name: macos-with-vnc
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup VNC
      env:
        VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      run: |
        set -Eeuo pipefail

        echo "===== 1. Enable macOS Screen Sharing (VNC) ====="
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on \
          -restart -agent -privs -all \
          -clientopts -setvnclegacy -vnclegacy yes \
          -clientopts -setvncpw -vncpw "$VNC_PASSWORD"

        echo "VNC aktiviert."

    - name: Setup Tailscale (CLI, macOS)
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        set -Eeuo pipefail

        echo "===== 1. Uninstall any GUI cask leftovers ====="
        brew uninstall --cask tailscale-app 2>/dev/null || true
        brew uninstall --cask tailscale 2>/dev/null || true

        echo "===== 2. Install Tailscale CLI formula ====="
        brew install tailscale

        echo "===== 3. Locate binaries ====="
        TAILSCALED="$(command -v tailscaled || true)"
        TAILSCALE_CLI="$(command -v tailscale || true)"

        # Falls nicht im PATH, in Homebrew-Verzeichnissen suchen
        if [[ -z "$TAILSCALED" ]]; then
          TAILSCALED="$(find /opt/homebrew /usr/local -name tailscaled -type f 2>/dev/null | head -n1 || true)"
        fi
        if [[ -z "$TAILSCALE_CLI" ]]; then
          TAILSCALE_CLI="$(find /opt/homebrew /usr/local -name tailscale -type f 2>/dev/null | head -n1 || true)"
        fi

        echo "tailscaled : $TAILSCALED"
        echo "tailscale  : $TAILSCALE_CLI"

        if [[ -z "$TAILSCALED" || -z "$TAILSCALE_CLI" ]]; then
          echo "::error::Tailscale binaries nicht gefunden."
          echo "brew --prefix: $(brew --prefix)"
          ls -la "$(brew --prefix)/bin" | grep -i tailscale || true
          exit 1
        fi

        echo "===== 4. Start tailscaled (userspace) ====="
        sudo mkdir -p /var/lib/tailscale /var/run/tailscale
        sudo "$TAILSCALED" \
          --tun=userspace-networking \
          --state=/var/lib/tailscale/tailscaled.state \
          --socket=/var/run/tailscale/tailscaled.sock \
          > /tmp/tailscaled.log 2>&1 &
        disown

        sleep 8

        echo "===== 5. Check tailscaled socket ====="
        if ! sudo test -S /var/run/tailscale/tailscaled.sock; then
          echo "::error::tailscaled socket nicht vorhanden."
          cat /tmp/tailscaled.log || true
          exit 1
        fi
        echo "Socket OK."

        echo "===== 6. tailscale up (timeout 90s) ====="
        timeout 90s sudo "$TAILSCALE_CLI" \
          --socket=/var/run/tailscale/tailscaled.sock \
          up \
          --authkey="$TAILSCALE_AUTH_KEY" \
          --hostname="gha-macos-vnc" \
          --timeout=45s \
          --reset || {
            echo "::error::tailscale up fehlgeschlagen oder Timeout."
            cat /tmp/tailscaled.log || true
            timeout 10s sudo "$TAILSCALE_CLI" --socket=/var/run/tailscale/tailscaled.sock status || true
            exit 1
          }

        echo "===== 7. Tailscale status ====="
        sudo "$TAILSCALE_CLI" --socket=/var/run/tailscale/tailscaled.sock status

    - name: Show Tailscale IP
      run: |
        set -Eeuo pipefail

        TAILSCALE_CLI="$(command -v tailscale || find /opt/homebrew /usr/local -name tailscale -type f 2>/dev/null | head -n1 || true)"

        echo "=========================================="
        echo "         VNC CONNECTION INFO"
        echo "=========================================="
        TS_IP="$(sudo "$TAILSCALE_CLI" --socket=/var/run/tailscale/tailscaled.sock ip -4 | head -n1 || true)"
        echo "Address  : $TS_IP  (Port 5900 – Standard)"
        echo "User     : vncuser"
        echo "Password : (aus deinem VNC_PASSWORD Secret)"
        echo ""
        echo "RealVNC-Adresse: $TS_IP:5900"
        echo "=========================================="

    - name: Keep session alive (tmate)
      uses: mxschmitt/action-tmate@v3
